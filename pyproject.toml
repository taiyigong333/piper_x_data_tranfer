[project]
name = "piperx-to-dynamic-vla"
version = "0.1.0"
description = "Convert Piper-X collection HDF5 trajectories to DynamicVLA LeRobot data."
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pandas>=2.0",
  "pillow>=10.0",
  "pyarrow>=14.0",
]
