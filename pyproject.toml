[project]
name = "piperx-to-tempo-vla"
version = "0.1.0"
description = "Piper-X 正向 HDF5 到 TEMPO LeRobot v2.1 的可追溯转换"
requires-python = ">=3.11,<3.12"
dependencies = [
  "av>=14,<17",
  "h5py>=3.10,<4",
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.10,<4.12",
  "pyarrow>=18,<24",
]

[project.scripts]
piperx-to-tempo = "piperx_to_tempo_vla.convert:main"
tempo-validate = "piperx_to_tempo_vla.validate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
